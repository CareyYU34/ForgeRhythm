<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Forge Rhythm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="topbar">
      <div class="settings-wrap">
        <button id="settingsToggle" class="topbar-btn settings-btn">
          <i class="fas fa-gear"></i>
          設定
        </button>

        <div class="settings-panel is-hidden" id="settingsPanel">
          <div class="settings-panel-header">工具設定</div>
          <div class="runtime-controls" id="runtimeControls"></div>
          <div class="sound-rack" id="soundRack"></div>
        </div>
      </div>

      <button id="toggle" class="topbar-btn">關閉鏡頭</button>

      <div class="yt-input-row">
        <input id="ytUrl" class="yt-url" placeholder="youtube 連結輸入" />
        <button id="ytLoadBtn" class="yt-load-btn">載入</button>
      </div>
    </div>

    <div class="layout">
      <div class="stage">
        <div class="camera-frame">
          <video id="webcam" autoplay playsinline></video>
          <canvas id="output"></canvas>
        </div>
      </div>

      <div id="ytPanel" class="player-card is-hidden">
        <div class="video-wrapper">
          <div class="player" id="player"></div>

          <div class="overlay-play" id="overlayPlay">
            <i class="fas fa-play"></i>
          </div>

          <div class="controls-bar">
            <button id="playPauseBtn" class="btn">
              <i class="fas fa-play"></i>
            </button>

            <div class="volume-container">
              <button id="muteBtn" class="btn">
                <i class="fas fa-volume-high"></i>
              </button>
              <input
                type="range"
                id="volumeSlider"
                min="0"
                max="100"
                value="100"
                class="slider volume"
              />
            </div>

            <select id="playbackSpeed" class="control-select">
              <option value="0.5">0.5x</option>
              <option value="0.75">0.75x</option>
              <option value="1" selected>1x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>

            <span class="time">
              <span id="currentTime">0:00</span> /
              <span id="duration">0:00</span>
            </span>

            <div class="seek-container">
              <input
                type="range"
                id="seekBar"
                min="0"
                max="100"
                value="0"
                class="slider seek"
              />
            </div>

            <button id="fullscreenBtn" class="fullscreen-btn">
              <i class="fas fa-expand"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
