<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Forge Rhythm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="topbar">
      <div class="settings-wrap">
        <button id="settingsToggle" class="topbar-btn settings-btn">
          <i class="fas fa-gear"></i>
          設定
        </button>

        <div class="settings-panel is-hidden" id="settingsPanel">
          <div class="settings-panel-header">工具設定</div>
          <div class="debug-controls" id="debugControls"></div>
          <div class="runtime-controls" id="runtimeControls"></div>
          <div class="sound-rack" id="soundRack"></div>
        </div>
      </div>

      <div class="hit-display" id="hitDisplay" aria-live="polite"></div>

      <button id="toggle" class="topbar-btn">關閉鏡頭</button>

      <button id="calibrateBtn" class="topbar-btn calibrate-btn">
        <i class="fas fa-crosshairs"></i>
        校正
      </button>

      <div class="media-tools">
        <div class="midi-library-panel">
          <div class="midi-library-row">
            <input
              id="midiSongQuery"
              class="midi-control midi-song-query"
              placeholder="歌曲名稱搜尋"
            />
            <select id="midiCategory" class="midi-control midi-category">
              <option value="">全部類別</option>
            </select>
            <select id="midiSongSelect" class="midi-control midi-song-select">
              <option value="">請先輸入歌曲名稱或選擇類別</option>
            </select>
            <div class="yt-input-row">
              <input id="ytUrl" class="yt-url" placeholder="youtube 連結輸入" />
              <button id="ytLoadBtn" class="yt-load-btn">載入</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="layout">
      <div class="stage">
        <div class="camera-frame">
          <video id="webcam" autoplay playsinline></video>
          <canvas id="output"></canvas>
        </div>

        <!-- 校準 Overlay -->
        <div
          id="calibOverlay"
          class="calib-overlay is-hidden"
          aria-live="polite"
        >
          <button
            id="calibCancelBtn"
            class="calib-cancel-btn"
            aria-label="取消校準"
          >
            <i class="fas fa-xmark"></i>
          </button>

          <!-- 共用視覺區：圖片 / GIF -->
          <div class="calib-visual-wrap" id="calibVisualWrap">
            <img
              id="calibVisualImg"
              class="calib-visual-img"
              src=""
              alt="示範動作"
            />
          </div>

          <!-- SNAPSHOT 畫面 -->
          <div class="calib-screen" id="calibScreenReady">
            <div class="calib-countdown-num" id="calibCountdownNum"></div>
            <p class="calib-instruction" id="calibReadyText"></p>
          </div>

          <!-- STRIKING 畫面 -->
          <div class="calib-screen is-hidden" id="calibScreenZone">
            <div class="calib-strike-progress" id="calibStrikeProgress">
              <div class="calib-progress-track">
                <div class="calib-progress-fill" id="calibProgressFill"></div>
                <div class="calib-progress-divider" style="left: 33.33%"></div>
                <div class="calib-progress-divider" style="left: 66.66%"></div>
              </div>
              <p class="calib-strike-counter" id="calibStrikeCounter">0 / 3</p>
            </div>
            <p class="calib-instruction" id="calibZoneLabel"></p>
          </div>

          <!-- DONE 畫面 -->
          <div class="calib-screen is-hidden" id="calibScreenDone">
            <i class="fas fa-circle-check calib-done-icon"></i>
            <p class="calib-done-text">校準完成</p>
            <p class="calib-done-sub">系統已記住你的打擊習慣</p>
          </div>
        </div>
      </div>

      <div id="ytPanel" class="player-card is-hidden">
        <div class="video-wrapper">
          <div class="player" id="player"></div>

          <div class="overlay-play" id="overlayPlay">
            <i class="fas fa-play"></i>
          </div>

          <div class="controls-bar">
            <button id="playPauseBtn" class="btn">
              <i class="fas fa-play"></i>
            </button>

            <div class="volume-container">
              <button id="muteBtn" class="btn">
                <i class="fas fa-volume-high"></i>
              </button>
              <input
                type="range"
                id="volumeSlider"
                min="0"
                max="100"
                value="100"
                class="slider volume"
              />
            </div>

            <select id="playbackSpeed" class="control-select">
              <option value="0.5">0.5x</option>
              <option value="0.75">0.75x</option>
              <option value="1" selected>1x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>

            <span class="time">
              <span id="currentTime">0:00</span> /
              <span id="duration">0:00</span>
            </span>

            <div class="seek-container">
              <input
                type="range"
                id="seekBar"
                min="0"
                max="100"
                value="0"
                class="slider seek"
              />
            </div>

            <button id="fullscreenBtn" class="fullscreen-btn">
              <i class="fas fa-expand"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
